version: "3.9"

services:
  db:
    image: postgres:15
    container_name: daily-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: daily_user
      POSTGRES_PASSWORD: daily_pass
      POSTGRES_DB: daily_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
